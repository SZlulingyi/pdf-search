# 使用苏州同事提供的远程 FastAPI 服务
model_dir: ""  # provider=http 时不需要本地 BGE 模型目录
pdf_dir: ""
data_dir: "data"
qdrant_path: "data/qdrant"
sqlite_path: "data/index.db"
collection: "doc_chunks"
top_k: 20
rrf_k: 60

embed:
  provider: "http"
  base_url: "http://100.64.0.10:8002"
  endpoint: "/v1/embeddings"
  api_key: "bge-key-xxxx"
  model: "bge-m3"
  timeout: 120
  batch_size: 16
  normalize: false

chunk:
  max_chars: 800

ocr:
  enabled: true
  provider: "http"
  mode: "scan"  # scan: 扫描页逐页 OCR；pdf: 整份 PDF 发给远程 OCR
  base_url: "http://100.64.0.10:8001"
  endpoint: "/v1/ocr"
  api_key: "ocr-key-xxxx"
  file_field: "file"
  page_base: 1
  timeout: 300
  lang: "ch"
  cache_dir: "data/ocr_cache"
  dpi: 200
