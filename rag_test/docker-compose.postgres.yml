services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhisuo
      POSTGRES_USER: zhisuo
      POSTGRES_PASSWORD: zhisuo
    ports:
      - "5432:5432"
    volumes:
      - zhisuo-postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - zhisuo-qdrant:/qdrant/storage

volumes:
  zhisuo-postgres:
  zhisuo-qdrant:
